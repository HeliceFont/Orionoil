<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t">
  <title id="t">Orión — emblema</title>
  <defs>
    <!-- Estrella de 4 puntas, radio 7 -->
    <path id="star" d="M0 -7 Q1.4 -1.4 7 0 Q1.4 1.4 0 7 Q-1.4 1.4 -7 0 Q-1.4 -1.4 0 -7 Z"/>

    <!-- Arcos para el texto circular -->
    <path id="arcoSup" d="M-117 0 A117 117 0 0 1 117 0"/>
    <path id="arcoInf" d="M-131 0 A131 131 0 0 0 131 0"/>

    <!-- Pétalo grabado -->
    <path id="petalo" d="M0 -100 C11 -90 11 -76 0 -66 C-11 -76 -11 -90 0 -100 Z"/>
    <g id="cuarto">
      <use href="#petalo"/>
      <use href="#petalo" transform="rotate(22.5)"/>
      <use href="#petalo" transform="rotate(45)"/>
      <use href="#petalo" transform="rotate(67.5)"/>
    </g>
    <g id="corona">
      <use href="#cuarto"/>
      <use href="#cuarto" transform="rotate(90)"/>
      <use href="#cuarto" transform="rotate(180)"/>
      <use href="#cuarto" transform="rotate(270)"/>
    </g>

    <!-- Núcleo: cielo nocturno con la constelación de Orión -->
    <g id="nucleo">
      <circle r="58" fill="#0C1626"/>
      <circle r="58" fill="none" stroke="#E8A917" stroke-width="1.2"/>
      <g fill="none" stroke="#E8A917" stroke-width="0.9" stroke-linejoin="round" opacity="0.85">
        <path d="M-24 -40 L20 -34 L12 -6 L26 34 L-18 40 L-12 2 Z"/>
        <path d="M-12 2 L12 -6"/>
      </g>
      <use href="#star" transform="translate(-24 -40) scale(1.05)" fill="#E8A917"/>
      <g fill="#FAF6EC">
        <use href="#star" transform="translate(20 -34) scale(0.7)"/>
        <use href="#star" transform="translate(-12 2) scale(0.6)"/>
        <use href="#star" transform="translate(0 -2) scale(0.6)"/>
        <use href="#star" transform="translate(12 -6) scale(0.6)"/>
        <use href="#star" transform="translate(-18 40) scale(0.7)"/>
        <use href="#star" transform="translate(26 34) scale(0.95)"/>
      </g>
    </g>

    <!-- Emblema completo, radio 150 -->
    <g id="emblema">
      <circle r="150" fill="#14233B"/>
      <circle r="144" fill="none" stroke="#E8A917" stroke-width="1.6"/>
      <circle r="109" fill="none" stroke="#E8A917" stroke-width="0.6"/>

      <text font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="27" font-weight="600" letter-spacing="9" fill="#FAF6EC" text-anchor="middle">
        <textPath href="#arcoSup" startOffset="50%">ORIÓN</textPath>
      </text>
      <text font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="3.4" fill="#E8A917" text-anchor="middle">
        <textPath href="#arcoInf" startOffset="50%">ACEITE DE GIRASOL PREMIUM</textPath>
      </text>
      <g fill="#E8A917">
        <use href="#star" transform="translate(-125 0) scale(0.9)"/>
        <use href="#star" transform="translate(125 0) scale(0.9)"/>
      </g>

      <use href="#corona" fill="none" stroke="#E8A917" stroke-width="0.9"/>
      <use href="#nucleo"/>
    </g>

    <!-- Versión reducida para favicon -->
    <g id="sello-mini">
      <circle r="66" fill="#14233B"/>
      <use href="#nucleo"/>
    </g>
  </defs>

  <rect width="900" height="520" fill="#FAF6EC"/>

  <!-- Emblema principal -->
  <use href="#emblema" transform="translate(240 260) scale(1.45)"/>

  <!-- Versión horizontal -->
  <use href="#emblema" transform="translate(560 170) scale(0.42)"/>
  <text x="640" y="182" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="50" font-weight="600" letter-spacing="6" fill="#14233B">ORIÓN</text>
  <text x="642" y="208" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.6" fill="#7A5200">ACEITE DE GIRASOL PREMIUM</text>

  <!-- Tamaños chicos -->
  <line x1="500" y1="290" x2="860" y2="290" stroke="#14233B" stroke-opacity="0.12"/>
  <use href="#sello-mini" transform="translate(560 380) scale(0.6)"/>
  <use href="#sello-mini" transform="translate(680 380) scale(0.36)"/>
  <use href="#sello-mini" transform="translate(770 380) scale(0.21)"/>
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#4B5669" text-anchor="middle">
    <text x="560" y="450">80 px</text>
    <text x="680" y="450">48 px</text>
    <text x="770" y="450">28 px</text>
  </g>
</svg>
