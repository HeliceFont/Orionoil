<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" role="img" aria-labelledby="orion-title">
  <title id="orion-title">Orión — Aceite de girasol premium</title>
  <defs>
    <path id="petalo" d="M70 8 C83 22 82 34 70 44 C58 34 57 22 70 8 Z"/>
    <g id="corona">
      <use href="#petalo"/>
      <use href="#petalo" transform="rotate(30 70 70)"/>
      <use href="#petalo" transform="rotate(60 70 70)"/>
      <use href="#petalo" transform="rotate(90 70 70)"/>
      <use href="#petalo" transform="rotate(120 70 70)"/>
      <use href="#petalo" transform="rotate(150 70 70)"/>
      <use href="#petalo" transform="rotate(180 70 70)"/>
      <use href="#petalo" transform="rotate(210 70 70)"/>
      <use href="#petalo" transform="rotate(240 70 70)"/>
      <use href="#petalo" transform="rotate(270 70 70)"/>
      <use href="#petalo" transform="rotate(300 70 70)"/>
      <use href="#petalo" transform="rotate(330 70 70)"/>
    </g>
  </defs>

  <!-- Isotipo: girasol cuyo centro es el cielo nocturno con la constelación de Orión -->
  <use href="#corona" fill="#C98A0B" transform="rotate(15 70 70)"/>
  <use href="#corona" fill="#E8A917"/>
  <circle cx="70" cy="70" r="31" fill="#14233B"/>

  <!-- Cinturón de Orión (Las Tres Marías): tres estrellas de cuatro puntas -->
  <path d="M54 77 L86 63" fill="none" stroke="#E8A917" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>
  <g fill="#FAF6EC">
    <path id="estrella" d="M0 -7 Q1.4 -1.4 7 0 Q1.4 1.4 0 7 Q-1.4 1.4 -7 0 Q-1.4 -1.4 0 -7 Z" transform="translate(70 70) scale(1.25)"/>
    <path d="M0 -7 Q1.4 -1.4 7 0 Q1.4 1.4 0 7 Q-1.4 1.4 -7 0 Q-1.4 -1.4 0 -7 Z" transform="translate(54 77) scale(0.95)"/>
    <path d="M0 -7 Q1.4 -1.4 7 0 Q1.4 1.4 0 7 Q-1.4 1.4 -7 0 Q-1.4 -1.4 0 -7 Z" transform="translate(86 63) scale(0.95)"/>
  </g>

  <!-- Logotipo -->
  <text x="160" y="84" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="56" font-weight="600" letter-spacing="7" fill="#14233B">ORIÓN</text>
  <text x="162" y="112" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="3.6" fill="#7A5200">ACEITE DE GIRASOL PREMIUM</text>
</svg>
