<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t">
  <title id="t">Orión — tres conceptos de logotipo</title>
  <defs>
    <!-- Estrella de 4 puntas, radio 7 -->
    <path id="star" d="M0 -7 Q1.4 -1.4 7 0 Q1.4 1.4 0 7 Q-1.4 1.4 -7 0 Q-1.4 -1.4 0 -7 Z"/>

    <!-- A · Gota de Orión -->
    <g id="isoA">
      <path d="M0 -50 C18 -22 34 -4 34 16 A34 34 0 1 1 -34 16 C-34 -4 -18 -22 0 -50 Z" fill="#E8A917"/>
      <g fill="#14233B">
        <use href="#star" transform="translate(-15 26)"/>
        <use href="#star" transform="translate(0 16) scale(1.25)"/>
        <use href="#star" transform="translate(15 6)"/>
      </g>
    </g>

    <!-- B · Reloj de Orión -->
    <g id="isoB" stroke-width="6" stroke-linejoin="round">
      <path d="M-30 -47 L30 -47 L9 -16 L-9 -16 Z" fill="#E8A917" stroke="#E8A917"/>
      <path d="M-9 16 L9 16 L30 47 L-30 47 Z" fill="#14233B" stroke="#14233B"/>
      <g fill="#C98A0B" stroke="none">
        <use href="#star" transform="translate(-18 6)"/>
        <use href="#star" transform="translate(0 0) scale(1.2)"/>
        <use href="#star" transform="translate(18 -6)"/>
      </g>
    </g>

    <!-- C · La Ó solar -->
    <g id="isoC">
      <circle r="20" fill="#E8A917"/>
      <g fill="#14233B">
        <circle cx="-9" cy="5" r="2.8"/>
        <circle cx="0" cy="0" r="3.4"/>
        <circle cx="9" cy="-5" r="2.8"/>
      </g>
      <use href="#star" transform="translate(5 -31) scale(1.15)" fill="#C98A0B"/>
    </g>
    <g id="wordC" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="56" font-weight="600" fill="#14233B">
      <text x="-4" y="0" text-anchor="end" letter-spacing="5">ORI</text>
      <use href="#isoC" transform="translate(20 -19.5)"/>
      <text x="47" y="0">N</text>
    </g>
  </defs>

  <rect width="900" height="520" fill="#FAF6EC"/>

  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#4B5669" text-anchor="middle">
    <text x="150" y="44">A · GOTA DE ORIÓN</text>
    <text x="450" y="44">B · RELOJ DE ORIÓN</text>
    <text x="750" y="44">C · LA Ó SOLAR</text>
  </g>
  <g stroke="#14233B" stroke-opacity="0.12">
    <line x1="300" y1="30" x2="300" y2="490"/>
    <line x1="600" y1="30" x2="600" y2="490"/>
  </g>

  <!-- Fila 1: símbolo grande -->
  <use href="#isoA" transform="translate(150 160) scale(1.4)"/>
  <use href="#isoB" transform="translate(450 160) scale(1.4)"/>
  <use href="#wordC" transform="translate(766 180)"/>

  <!-- Fila 2: versión horizontal -->
  <g font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="38" font-weight="600" letter-spacing="4" fill="#14233B">
    <use href="#isoA" transform="translate(68 338) scale(0.5)"/>
    <text x="100" y="352">ORIÓN</text>
    <use href="#isoB" transform="translate(368 338) scale(0.5)"/>
    <text x="400" y="352">ORIÓN</text>
  </g>
  <use href="#wordC" transform="translate(760 352) scale(0.62)"/>

  <!-- Fila 3: prueba a tamaño favicon -->
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#4B5669" text-anchor="middle">
    <text x="150" y="490">28 px</text>
    <text x="450" y="490">28 px</text>
    <text x="750" y="490">28 px</text>
  </g>
  <use href="#isoA" transform="translate(150 448) scale(0.28)"/>
  <use href="#isoB" transform="translate(450 448) scale(0.28)"/>
  <use href="#isoC" transform="translate(750 452) scale(0.6)"/>
</svg>
